description: Огляд матеріалів — завантажити джерела й отримати структурований огляд (ключові факти, суперечності, прогалини) → DOCX
params:
  ТЕМА: {default: "надані матеріали", help: "про що матеріали / на чому зосередитися"}
title: "Огляд: {{ТЕМА}}"
create: true
chat:
  response_length: longer
tasks:
  - ask: >-
      Підготуй структурований огляд усіх джерел щодо теми «{{ТЕМА}}»: 1) короткий зміст кожного джерела;
      2) ключові факти й дати; 3) суперечності між джерелами; 4) прогалини — чого бракує для висновку;
      5) стислий підсумок. Посилайся на джерела.
    title: Огляд матеріалів
  - explore: {steps: 3}
output:
  format: docx
  citations: list
