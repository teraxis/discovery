description: Аналіз доброчесності кандидата на посаду судді (промпт dobrochesnist_v1 у «Налаштування чату», відповідь частинами до таблиці майна) → досьє DOCX
params:
  ПІБ: {required: true, help: "Прізвище Ім'я По батькові кандидата"}
title: "{{ПІБ}}"
notebook: "{{ПІБ}}"
create: true
chat:
  persona: dobrochesnist_v1
  response_length: longer
tasks:
  - ask: "Проаналізуй усі джерела щодо кандидата {{ПІБ}} відповідно до налаштувань чату."
    continue:
      max: 15
      prompt: >-
        Продовжуй відповідно до налаштувань чату: опиши наступні обставини або наступний блок.
        Після останнього блоку надай запитання кандидату, узагальнений висновок щодо ризику
        та таблицю майна для додаткової перевірки.
      until: '(\|\s*\**Тип майна)|(Таблиц[яі] майна[^\n]*\n(\s*\n)*\s*\|)|(аналіз (повністю )?завершено)'
output:
  filename: "{{ПІБ}}"
  format: docx
  style: dossier
  title: "{{ПІБ}}"
