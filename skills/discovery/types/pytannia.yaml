description: Відповіді на перелік питань до матеріалів (файл з питаннями — по одному на рядок або розділені рядком ---) → DOCX
params:
  ПИТАННЯ: {required: true, help: "шлях до .txt/.md з питаннями"}
title: "Відповіді на питання"
